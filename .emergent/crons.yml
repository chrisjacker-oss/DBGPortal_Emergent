crons:
  - name: overdue-reminders
    description: "Emails customers a friendly reminder each morning for invoices past their due date"
    cron: "0 15 * * *"
    endpoint: "{{BASE_URL}}/api/cron/overdue-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: install-reminders
    description: "Emails customers a reminder the day before their scheduled installation"
    cron: "0 15 * * *"
    endpoint: "{{BASE_URL}}/api/cron/install-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-crm-backup
    description: "Creates and stores a complete CRM backup on the first of every month"
    cron: "0 8 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-crm-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
